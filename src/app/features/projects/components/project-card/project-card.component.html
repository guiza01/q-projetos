<ion-card>
  <ion-card-header>
    <ion-card-title>{{ project.name }}</ion-card-title>
    <ion-card-subtitle>{{ project.status }}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <p>{{ project.description }}</p>

    <div class="project-dates">
      <span>Início: {{ project.startDate || 'Não informado' }}</span>
      <span>Término: {{ project.endDate || 'Não informado' }}</span>
    </div>
  </ion-card-content>
</ion-card>
