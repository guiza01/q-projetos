<ion-content class="login-content">
  <div class="login-container">
    
    <img src="assets/logo.png" alt="Q-Projetos" class="logo">
    <h1 class="welcome-title">Bem-vindo(a)!</h1>
    <p class="welcome-subtitle">Faça login para acessar sua conta</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="input-group">
        <label>Email</label>
        <ion-item lines="none" class="custom-input">
          <ion-icon slot="start" name="person-sharp"></ion-icon>
          <ion-input type="email" placeholder="Digite seu email" formControlName="email"></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Senha</label>
        <ion-item lines="none" class="custom-input">
          <ion-icon slot="start" name="lock-closed-sharp"></ion-icon>
          <ion-input type="password" placeholder="Digite sua senha" formControlName="password"></ion-input> 
        </ion-item>
      </div>

      <div class="forgot-password-container">
        <ion-button fill="clear" class="forgot-password-button" (click)="goToEsqueceuSenha()">
          Esqueceu sua senha?
        </ion-button>
      </div>

      <ion-text color="danger" *ngIf="errorMessage" class="error-message">
        <p>{{ errorMessage }}</p>
      </ion-text>

      <ion-button type="submit" expand="block" class="login-button" [disabled]="form.invalid || isLoading">
        <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
        <span *ngIf="!isLoading">Entrar</span>
      </ion-button>

      <div class="divider">
        <span>ou continue com</span>
      </div>

      <ion-button fill="outline" expand="block" class="google-login-button" (click)="loginComGoogle()" [disabled]="isLoading">
        <ion-icon name="logo-google" slot="start"></ion-icon>
        Google
      </ion-button>

      <div class="register-text">
        <span>Não tem uma conta?</span>
        <ion-button fill="clear" class="register-link-button" (click)="goToCadastro()">
          Cadastre-se
        </ion-button>
      </div>

    </form>
  </div>
</ion-content>
