<ion-content class="login-content">

  <div class="login-container">

    <img src="assets/logo.png" alt="Q-Projetos" class="logo">

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="input-group">
        <label>Email</label>

        <ion-item lines="none" class="custom-input">

          <ion-icon fill="solid" name="person" size="small" color="white"></ion-icon>
          <ion-input
            type="email"

            placeholder="Digite seu email"
            formControlName="email">
          </ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Senha</label>

        <ion-item lines="none" class="custom-input">
          <ion-icon   fill="solid" name="lock-closed" size="small" color="white"></ion-icon>
          <ion-input
            type="password"
            placeholder="Digite sua senha"
            formControlName="password">
          </ion-input>
        </ion-item>
      </div>

      <ion-text color="danger" *ngIf="errorMessage">
        <p>{{ errorMessage }}</p>
      </ion-text>


      <ion-button
        type="submit"
        expand="block"
        class="login-button">

        <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>

        <span *ngIf="!isLoading">Entrar</span>

      </ion-button>

    </form>

  </div>

</ion-content>
