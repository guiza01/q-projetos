<ion-header>
  <ion-toolbar>
    <ion-title>Teste de Login API</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Validação simples</ion-card-title>
      <ion-card-subtitle>POST /api/auth/login</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p><strong>Email:</strong> admin&#64;ifpe.edu.br</p>
      <p><strong>Senha:</strong> admin123</p>

      <ion-button expand="block" (click)="testLogin()" [disabled]="isLoading">
        <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
        <span *ngIf="!isLoading">Executar teste</span>
      </ion-button>

      <ion-text color="danger" *ngIf="errorMessage">
        <p>{{ errorMessage }}</p>
      </ion-text>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="responseContent">
    <ion-card-header>
      <ion-card-title>Resposta da API</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <pre>{{ responseContent }}</pre>
    </ion-card-content>
  </ion-card>
</ion-content>
