<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Visitante</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Visitante</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <ion-text color="secondary">
      <p>Modo de visualização: Você pode consultar os projetos disponíveis.</p>
    </ion-text>

    <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

    <ion-text color="danger" *ngIf="!isLoading && errorMessage">
      <p>{{ errorMessage }}</p>
    </ion-text>

    <ng-container *ngIf="!isLoading && !errorMessage">
      <app-project-card *ngFor="let project of projects" [project]="project" (click)="onViewProjectDetails(project)"></app-project-card>

      <ion-text *ngIf="projects.length === 0">
        <p>Nenhum projeto encontrado.</p>
      </ion-text>
    </ng-container>
  </div>
</ion-content>
