<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="menu-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="title-center">
      Q-Projetos
    </ion-title>

    <ion-buttons slot="end">
      <ion-avatar class="avatar">
        <img src="assets/avatar-placeholder.png" alt="Perfil" />
      </ion-avatar>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <ion-searchbar 
      placeholder="pesquise aqui" 
      animated="true"
      (ionInput)="handleSearch($event)">
    </ion-searchbar>
  </ion-toolbar>

  <div class="filter-chips-wrapper">
    <ion-chip [outline]="selectedStatus !== 'Todos'" color="primary" (click)="selectStatus('Todos')">
      <ion-label>Todos</ion-label>
    </ion-chip>
    
    <ion-chip [outline]="selectedStatus !== 'Em andamento'" color="warning" (click)="selectStatus('Em andamento')">
      <ion-icon name="time-outline"></ion-icon>
      <ion-label>Em andamento</ion-label>
    </ion-chip>

    <ion-chip [outline]="selectedStatus !== 'Concluido'" color="success" (click)="selectStatus('Concluido')">
      <ion-icon name="checkmark-done-outline"></ion-icon>
      <ion-label>Concluído</ion-label>
    </ion-chip>
  </div>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">
    
    <div class="ion-text-center" *ngIf="isLoading">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p>Carregando projetos...</p>
    </div>

    <ion-text color="danger" *ngIf="!isLoading && errorMessage">
      <p class="ion-text-center">{{ errorMessage }}</p>
    </ion-text>

    <ion-grid *ngIf="!isLoading && !errorMessage">
      <ion-row>
        <ion-col size="12" size-md="6" size-lg="4" *ngFor="let project of filteredProjects">
          <app-project-card [project]="project"></app-project-card>
        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-text *ngIf="!isLoading && filteredProjects.length === 0">
      <div class="ion-text-center ion-padding">
        <ion-icon name="search-outline" style="font-size: 48px; color: #ccc;"></ion-icon>
        <p>Nenhum projeto encontrado para os filtros selecionados.</p>
      </div>
    </ion-text>
  </div>
</ion-content>
