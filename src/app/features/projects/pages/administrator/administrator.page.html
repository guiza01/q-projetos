<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Administrador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Administrador</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <ion-button expand="block" color="success" (click)="onProjectCreate()">
      Criar Novo Projeto
    </ion-button>

    <ion-button expand="block" color="secondary" (click)="onManageUsers()">
      Gerenciar Usuários
    </ion-button>

    <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

    <ion-text color="danger" *ngIf="!isLoading && errorMessage">
      <p>{{ errorMessage }}</p>
    </ion-text>

    <ng-container *ngIf="!isLoading && !errorMessage">
      <app-project-card *ngFor="let project of projects" [project]="project"></app-project-card>

      <ion-text *ngIf="projects.length === 0">
        <p>Nenhum projeto encontrado.</p>
      </ion-text>
    </ng-container>
  </div>
</ion-content>
