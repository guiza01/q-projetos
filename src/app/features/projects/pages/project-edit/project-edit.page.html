<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-back-button default-href="/projects"></ion-back-button>
    <ion-title>{{ projectId ? 'Editar Projeto' : 'Novo Projeto' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ projectId ? 'Editar Projeto' : 'Novo Projeto' }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!isLoading">
      <ion-item>
        <ion-label position="floating">Título</ion-label>
        <ion-input type="text" formControlName="title" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Descrição</ion-label>
        <ion-textarea formControlName="description" required></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Coordenador</ion-label>
        <ion-input type="text" formControlName="coordinator" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Status</ion-label>
        <ion-select formControlName="status">
          <ion-select-option value="active">Ativo</ion-select-option>
          <ion-select-option value="inactive">Inativo</ion-select-option>
          <ion-select-option value="paused">Pausado</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-text color="danger" *ngIf="errorMessage">
        <p>{{ errorMessage }}</p>
      </ion-text>

      <div class="button-group">
        <ion-button type="submit" expand="block" color="success" [disabled]="form.invalid || isSaving">
          <ion-spinner name="crescent" *ngIf="isSaving"></ion-spinner>
          <span *ngIf="!isSaving">Salvar</span>
        </ion-button>

        <ion-button type="button" expand="block" color="medium" (click)="onCancel()">
          Cancelar
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
